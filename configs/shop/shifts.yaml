# Shift Schedules, Breaks and Operator Roster
shifts:
  - shift_id: "DAY_SHIFT"
    name: "Morning/Day Shift"
    start_hour: 7.0
    duration_hours: 8.5
    days_of_week: [0, 1, 2, 3, 4]
    breaks:
      - name: "Morning Tea Break"
        start_minute: 150.0  # 9:30 AM
        duration_minutes: 15.0
      - name: "Lunch Break"
        start_minute: 300.0  # 12:00 PM
        duration_minutes: 30.0
      - name: "Afternoon Break"
        start_minute: 420.0  # 2:00 PM
        duration_minutes: 15.0

  - shift_id: "SWING_SHIFT"
    name: "Evening/Swing Shift"
    start_hour: 15.5
    duration_hours: 8.5
    days_of_week: [0, 1, 2, 3, 4]
    breaks:
      - name: "Evening Tea Break"
        start_minute: 150.0
        duration_minutes: 15.0
      - name: "Dinner Break"
        start_minute: 300.0
        duration_minutes: 30.0

