# Fixtures and Sequence-Dependent Setup Matrix
fixtures:
  - fixture_id: "VISE_6INCH_DUAL"
    fixture_type: "VISE_STD"
    description: "6-inch Precision Dual Station Milling Vise"
    total_quantity: 8

  - fixture_id: "CHUCK_4JAW_SCROLL"
    fixture_type: "CHUCK_ROTARY"
    description: "8-inch 4-Jaw Self-Centering Chuck on 4th Axis"
    total_quantity: 4

  - fixture_id: "TOMBSTONE_4SIDED"
    fixture_type: "TOMBSTONE"
    description: "4-Sided Modular Grid Tombstone for Pallet VMC"
    total_quantity: 4

  - fixture_id: "VACUUM_FIXTURE_PLATE"
    fixture_type: "VACUUM_PLATE"
