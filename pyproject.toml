[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmc-twin"
version = "0.1.0"
description = "Production-quality CNC VMC Shop Floor Digital Twin: Discrete-Event Simulation, Explainable Expert System, CP-SAT Optimizer & Tool-Wear Prognostics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "VMC Twin Team" }
]
dependencies = [
    "simpy>=4.1.1",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "ortools>=9.10.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "plotly>=5.22.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "streamlit>=1.35.0",
]

[project.scripts]
vmc = "vmc_twin.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "simpy.*",
    "ortools.*",
    "scipy.*",
    "plotly.*",
    "streamlit.*",
    "duckdb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
